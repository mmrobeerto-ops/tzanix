name: Seguridad
on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # cada lunes 06:00 UTC (escaneo semanal)
permissions:
  contents: read

jobs:
  dependencias:
    name: Auditoría de dependencias (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --audit-level=high || true
      - run: npx --yes oxlint@1.75.0 || true

  secretos:
    name: Búsqueda de secretos filtrados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
